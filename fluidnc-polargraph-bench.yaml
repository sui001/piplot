board: ESP32-S3 SuperMini
name: polargraph bench rig, portrait whiteboard 930 x 1500 usable
meta: gen3d / Cybernetic Garden. Generated against polargraph.whiteboard().

# ---------------------------------------------------------------------------
# Read this before flashing.
#
# This machine CANNOT HOME. FluidNC's WallPlotter kinematics returns false
# from canHome(), and there is nowhere to put a switch on a hanging gondola
# anyway. Instead it derives its zero cord lengths from wherever the pen is
# sitting at power on.
#
# So the startup ritual is: park the gondola on the cross marked at the CENTRE
# of the whiteboard, then power the board. That spot is cartesian (0, 0).
# Get it wrong and every coordinate is wrong, with nothing reported.
#
# Park at the centre rather than a corner because it is the easiest point to
# measure to with a tape from two edges, and because an error there is shared
# between both halves of the drawing instead of piling up at one edge.
#
# There are NO SOFT LIMITS, because soft limits without homing are a fiction.
# Nothing on the board will stop a path from winding the gondola up into an
# anchor. The guard is polargraph.Polargraph.check() on the Pi, exactly as it
# is for suidraw-0, and it is the only guard there is.
#
# Geometry, all from polargraph.whiteboard():
#   board 1100 x 1700 mm physically, 930 x 1500 mm usable. PORTRAIT.
#   anchors 940 mm apart, 500 mm above the top of the usable area
#   park point = centre of the usable area, so it spans x -465..465,
#     y -750..750, and the anchors sit at (-470, +1250) and (+470, +1250)
#
# Neither number is a guess, and both are counterintuitive.
#
# The anchors are only 10 mm wider than the board because WIDENING THEM MAKES
# IT WORSE. A wider span lays the far cord flatter at the top corners, which
# is where the angle floor bites: the worst corner cord goes 28.1, 26.3,
# 24.2, 21.6 degrees as the span goes 940, 1090, 1300, 1600 mm. Monotonic.
# At a 350 mm drop that same walk crosses the floor and corners get refused.
#
# The 500 mm drop buys the margin that makes it forgiving. 350 mm is the
# least that reaches every corner, but it leaves the worst cord at 20.5
# degrees against a 20 degree floor. 500 mm puts it at 28 degrees and drops
# peak cord tension from 11.2 N to 8.3 N, for 150 mm of wall and 120 mm of
# belt. Height is the lever, not width: mount the motors high and barely
# wider than the sheet. With 500 mm of drop, being 100 mm out on the span
# costs nothing.
#
# Wall needed: 1.14 m wide, and 2.0 m from the anchors down to the bottom of
# the usable area.
#
# Belt: 2.57 m per side, 5.14 m total, from polargraph.belt_length_mm().
# That is the longest cord (2.21 m), plus 50 mm of wrap over the 50T pulley,
# plus a clamp allowance, plus 250 mm of tail still hanging when the gondola
# is at its furthest. It is NOT the longest cord plus the travel range: the
# belt total never changes, it just transfers from the tail side to the
# gondola side as the gondola descends.
#
# Leave 2 m of clearance under each motor. At the gondola's CLOSEST point the
# tail is at its longest, 1.96 m, and it has to hang somewhere.
# ---------------------------------------------------------------------------

stepping:
  engine: RMT
  idle_ms: 255          # never release the motors: the gondola hangs on them
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12

kinematics:
  WallPlotter:
    left_axis: 0
    left_anchor_x: -470.000
    left_anchor_y: 1250.000
    right_axis: 1
    right_anchor_x: 470.000
    right_anchor_y: 1250.000

    # A straight line on the paper is NOT a straight line in cord space, and
    # this is the number that hides the difference. Unsegmented, a line
    # across the full 930 mm width at mid height bows 82 mm. polargraph's
    # max_segment_length() says 20.2 mm holds the bow under 0.1 mm here, and
    # 22.8 mm does the same in the full stairwell, so one value covers both.
    # 10 mm is FluidNC's own default and is comfortably inside that. Raising
    # it past 20 is how the drawing starts bowing again.
    segment_length: 10.000

axes:
  # Active low, wired to both drivers. One pin, two motors.
  shared_stepper_disable_pin: gpio.5:low

  # ---- x: the LEFT cord's length, not a cartesian axis -------------------
  # 32 steps/mm is GT2 on a 50 TOOTH pulley (100 mm/rev) at 1/16
  # microstepping: 3200 steps / 100 mm. Printed, 31.8 mm pitch diameter.
  #
  # THIS IS THE ONE NUMBER THAT SILENTLY SCALES THE WHOLE DRAWING. Get the
  # microstep jumpers wrong and everything comes out at half or double size
  # with no error anywhere. Check it first, on paper, with a tape measure:
  # draw a 500 mm line, measure it, scale this number by what you get over
  # what you asked for.
  #
  # 50T was chosen because Sui has printed a GT2 pulley that size before and
  # it ran, and because 3200/100 is exactly 32 rather than a recurring
  # decimal. It leaves 3x resolution headroom against the 0.1 mm bow
  # tolerance, costs 13.2 N.cm of torque at peak cord tension (a third of a
  # NEMA 17), and puts 25 teeth in the wrap, so one bad printed tooth is a
  # smaller share of what is carrying the belt. Nothing between 16T and 80T
  # is actually binding here.
  #
  # Other clean values if the print does not come out: 40T -> 40 steps/mm,
  # 64T -> 25 steps/mm, 20T -> 80 steps/mm.
  #
  # NOTE: WallPlotter runs the left motor backward on purpose
  # (motors[_left_axis] = 0 - (left_length - zero_left)). If the gondola runs
  # away from the left anchor when it should approach it, flip this one
  # motor's dir_pin with :low, not both.
  x:
    steps_per_mm: 32.000
    max_rate_mm_per_min: 6000.000      # 100 mm/s, plenty for ink
    acceleration_mm_per_sec2: 100.000  # see the pendulum note at the bottom
    max_travel_mm: 2300.000            # longest the left cord ever gets (2.21 m)
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.1
        direction_pin: gpio.2

  # ---- y: the RIGHT cord's length ----------------------------------------
  y:
    steps_per_mm: 32.000
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 2300.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.4
        direction_pin: gpio.6

  # ---- z: the pen servo ---------------------------------------------------
  # Z0 is down, Z5 is up, same shape as suidraw-0 so piplot's Grbl pen logic
  # transfers. max_travel_mm maps the servo's whole sweep onto 0..5 mm, so a
  # 5 mm Z move is the servo's full travel. Trim with min/max_pulse_us rather
  # than by changing the Z numbers, or piplot and the board disagree.
  z:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 600.000
    acceleration_mm_per_sec2: 1000.000
    max_travel_mm: 5.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      rc_servo:
        output_pin: gpio.7
        pwm_hz: 50
        min_pulse_us: 1000
        max_pulse_us: 2000

# No SD card, no SPI, no I2S. The SuperMini breaks out GPIO1 to GPIO13 and
# nothing above without soldering to the pads, so every pin here is one that
# is actually on the header. GPIO3 is deliberately skipped: it is an ESP32-S3
# strapping pin (JTAG source select) and is not worth the risk for the sake
# of a tidier sequence.
#
#   gpio.1  x step        left cord
#   gpio.2  x dir
#   gpio.4  y step        right cord
#   gpio.6  y dir
#   gpio.5  shared enable active low, both drivers
#   gpio.7  pen servo     50 Hz PWM
#
# Seven of thirteen pins spare. Do NOT power the drivers from the SuperMini's
# 3V3 regulator; give the motor rail its own supply and share only ground.
# TMC2209 logic is 3.3 V native, so nothing needs level shifting.

start:
  must_home: false

# ---------------------------------------------------------------------------
# Tuning, in the order it will actually matter.
#
# 1. acceleration_mm_per_sec2 is the pendulum knob, and it is the one real
#    problem this machine has. On cords up to 2.2 m the gondola is a 3.0
#    second pendulum with almost nothing damping it, and in the stairwell it
#    will be 6.1 seconds. Every acceleration rings it, and a heavier gondola
#    rings LONGER, because air drag barely grows with mass while the stored
#    swing energy grows in proportion. 100 is a deliberately timid starting
#    point. Raise it until the lines wobble, then halve it.
#
# 2. idle_ms is 255 (never disable) on purpose. Releasing the motors drops
#    the gondola, and since there is no homing it never finds itself again.
#
# 3. Sag is NOT corrected here and does not need to be on this rig: with an
#    800 g gondola it is under 0.04 mm anywhere on the board, and peak cord
#    tension is 8.3 N, which is 13.2 N.cm at the 50 tooth pulley: about a
#    third of what a NEMA 17 holds. It reaches about
#    0.9 mm at full stairwell scale with a 1.5 kg gondola, which is still
#    below the segment tolerance. polargraph.sag_error_mm() reports it.
# ---------------------------------------------------------------------------
