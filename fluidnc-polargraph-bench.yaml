board: ESP32 WROOM devkit (ESP32-D0WD-V3, 4 MB)
name: polargraph bench rig, portrait whiteboard 930 x 1500 usable
meta: gen3d / Cybernetic Garden. Generated against polargraph.whiteboard().

# ---------------------------------------------------------------------------
# Read this before flashing.
#
# This machine CANNOT HOME. FluidNC's WallPlotter kinematics returns false
# from canHome(), and there is nowhere to put a switch on a hanging gondola
# anyway. Instead it derives its zero cord lengths from wherever the pen is
# sitting at power on.
#
# So the startup ritual is: park the gondola on the cross marked at the CENTRE
# of the whiteboard, then power the board. That spot is cartesian (0, 0).
# Get it wrong and every coordinate is wrong, with nothing reported.
#
# Park at the centre rather than a corner because it is the easiest point to
# measure to with a tape from two edges, and because an error there is shared
# between both halves of the drawing instead of piling up at one edge.
#
# There are NO SOFT LIMITS, because soft limits without homing are a fiction.
# Nothing on the board will stop a path from winding the gondola up into an
# anchor. The guard is polargraph.Polargraph.check() on the Pi, exactly as it
# is for suidraw-0, and it is the only guard there is.
#
# Geometry, all from polargraph.whiteboard():
#   board 1100 x 1700 mm physically, 930 x 1500 mm usable. PORTRAIT.
#   anchors 940 mm apart, 500 mm above the top of the usable area
#   park point = centre of the usable area, so it spans x -465..465,
#     y -750..750, and the anchors sit at (-470, +1250) and (+470, +1250)
#
# Neither number is a guess, and both are counterintuitive.
#
# The anchors are only 10 mm wider than the board because WIDENING THEM MAKES
# IT WORSE. A wider span lays the far cord flatter at the top corners, which
# is where the angle floor bites: the worst corner cord goes 28.1, 26.3,
# 24.2, 21.6 degrees as the span goes 940, 1090, 1300, 1600 mm. Monotonic.
# At a 350 mm drop that same walk crosses the floor and corners get refused.
#
# The 500 mm drop buys the margin that makes it forgiving. 350 mm is the
# least that reaches every corner, but it leaves the worst cord at 20.5
# degrees against a 20 degree floor. 500 mm puts it at 28 degrees and drops
# peak cord tension from 11.2 N to 8.3 N, for 150 mm of wall and 120 mm of
# belt. Height is the lever, not width: mount the motors high and barely
# wider than the sheet. With 500 mm of drop, being 100 mm out on the span
# costs nothing.
#
# Wall needed: 1.14 m wide, and 2.0 m from the anchors down to the bottom of
# the usable area.
#
# Belt: 2.54 m per side, 5.08 m total, from polargraph.belt_length_mm().
# That is the longest cord (2.21 m), plus 20 mm of wrap over the 20T pulley,
# plus a clamp allowance, plus 250 mm of tail still hanging when the gondola
# is at its furthest. It is NOT the longest cord plus the travel range: the
# belt total never changes, it just transfers from the tail side to the
# gondola side as the gondola descends.
#
# Leave 2 m of clearance under each motor. At the gondola's CLOSEST point the
# tail is at its longest, 1.96 m, and it has to hang somewhere.
#
# BELT SEATING. The mechanical reference for this build is Thingiverse
# 1733420, "Polargraph - timing belt and spring load" by hinge (CC BY-NC): a
# bearing on a short hinged arm with a spring pulling it into the belt, which
# takes up slack and adds wrap angle in one part. With that fitted, the tail
# weight stops being a tuning problem and only has to keep the tail hanging
# straight, so 100-150 g is plenty. Without it, the tail weight is the ONLY
# thing seating the belt, and it has a hard ceiling: minimum cord tension
# anywhere on this board is 3.92 N, and a tail heavier than that lifts the
# gondola and goes slack.
#
# A sprung idler is unambiguously right HERE because gravity keeps the
# gondola side loaded and the belt only ever pulls one way. It is not
# automatically right on a reversing joint, where the spring reads out as
# backlash. See genarm docs/handover_elbow.md, which now says so.
# ---------------------------------------------------------------------------

stepping:
  engine: RMT
  idle_ms: 255          # never release the motors: the gondola hangs on them
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12

kinematics:
  WallPlotter:
    left_axis: 0
    left_anchor_x: -470.000
    left_anchor_y: 1250.000
    right_axis: 1
    right_anchor_x: 470.000
    right_anchor_y: 1250.000

    # A straight line on the paper is NOT a straight line in cord space, and
    # this is the number that hides the difference. Unsegmented, a line
    # across the full 930 mm width at mid height bows 82 mm. polargraph's
    # max_segment_length() says 20.2 mm holds the bow under 0.1 mm here, and
    # 22.8 mm does the same in the full stairwell, so one value covers both.
    # 10 mm is FluidNC's own default and is comfortably inside that. Raising
    # it past 20 is how the drawing starts bowing again.
    segment_length: 10.000

axes:
  # One pin to both drivers' EN. It is a DISABLE pin, and the attribute says
  # which electrical level means "disabled".
  #
  # The TMC2209's EN is active low: LOW = running, HIGH = off. So the
  # disable pin is active HIGH, which is :high. This was :low until 21 Sep,
  # written by confusing "EN is active low" with "the disable pin is active
  # low". They are opposites: FluidNC writes disable=true to this pin, and
  # :low would turn that into an electrical low, which RUNS the driver.
  #
  # What was actually observed, kept honest: the move test that did nothing
  # also had the 12 V unplugged, so it is no evidence against :low. What IS
  # verified, 21 Sep on the bench: with :high the motor moved smoothly up 20
  # mm and back and then held locked. FluidNC's own configs disagree with
  # each other here (midtbot :high, 3axis_v4 :low) because it depends on
  # whether a board has an inverter in between. Wired straight to the
  # driver, as here, it is :high, same as their official WallPlotter.yaml.
  shared_stepper_disable_pin: gpio.13:high

  # ---- x: the LEFT cord's length, not a cartesian axis -------------------
  # 80 steps/mm is GT2 on a 20 TOOTH pulley (40 mm/rev) at 1/16
  # microstepping: 3200 steps / 40 mm.
  #
  # THIS IS THE ONE NUMBER THAT SILENTLY SCALES THE WHOLE DRAWING. Get the
  # microstep jumpers wrong and everything comes out at half or double size
  # with no error reported anywhere. Check it first, on paper, with a tape
  # measure: draw a 500 mm line, measure it, scale this number by what you
  # got over what you asked for.
  #
  # This went 20T -> 50T -> 20T over one session, and the reasoning matters
  # more than the number.
  #
  # The metric that decides it is the FULL STEP, not the microstep.
  # Microstepping positions between full steps only as well as the driver's
  # current ratios hold against friction, and that nonlinearity runs about
  # +-10% of a full step no matter how finely you subdivide. So:
  #
  #   pulley   full step   real floor   torque at 8.3 N peak cord tension
  #     20T      0.20 mm      +-20 um     5.3 N.cm
  #     50T      0.50 mm      +-50 um    13.2 N.cm
  #     80T      0.80 mm      +-80 um    21.1 N.cm  (151% of a pancake NEMA 17)
  #
  # 20T wins on both, and is the size every printer spare already is. The
  # detour to 50T was on the theory that a printed pulley wants coarser
  # teeth, which is true but was answered better by Thingiverse 1733420
  # below: a proven polargraph running 20T with a sprung idler.
  #
  # If you ever do change pulley: 40T -> 40 steps/mm, 50T -> 32, 80T -> 20.
  #
  # NOTE: WallPlotter runs the left motor backward on purpose
  # (motors[_left_axis] = 0 - (left_length - zero_left)). If the gondola runs
  # away from the left anchor when it should approach it, flip this one
  # motor's dir_pin with :low, not both.
  #
  # VERIFIED 21 Sep on the bench, both motors as wired, shafts facing out:
  # G1 Y+ (gondola up) turns them OPPOSITE ways, G1 X+ (right) turns them
  # the SAME way, which is what winding in both cords, and letting one out
  # while taking one in, look like. No :low on either direction pin.
  x:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 6000.000      # 100 mm/s, plenty for ink
    acceleration_mm_per_sec2: 100.000  # see the pendulum note at the bottom
    max_travel_mm: 2300.000            # longest the left cord ever gets (2.21 m)
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.32
        direction_pin: gpio.33

  # ---- y: the RIGHT cord's length ----------------------------------------
  y:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 2300.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.25
        direction_pin: gpio.26

  # ---- z: the pen servo ---------------------------------------------------
  # Z0 is down, Z5 is up, same shape as suidraw-0 so piplot's Grbl pen logic
  # transfers. max_travel_mm maps the servo's whole sweep onto 0..5 mm, so a
  # 5 mm Z move is the servo's full travel. Trim with min/max_pulse_us rather
  # than by changing the Z numbers, or piplot and the board disagree.
  z:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 600.000
    acceleration_mm_per_sec2: 1000.000
    max_travel_mm: 5.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      rc_servo:
        output_pin: gpio.27
        pwm_hz: 50
        min_pulse_us: 1000
        max_pulse_us: 2000

# BOARD: a classic ESP32 WROOM devkit (ESP32-D0WD-V3, 4 MB, CH340 USB).
#
# This replaced the ESP32-S3 SuperMini on 21 Sep. FluidNC's pre-built S3
# firmware assumes 8 MB of flash, and even on a custom 4 MB partition table
# it took over the S3's USB at boot and then died before its console or WiFi
# came up, somewhere only a TX pin could show. The classic build is made for
# exactly this chip and flash size as shipped, and talks through a separate
# USB chip, so neither problem exists here. It is also older hardware, which
# is the point. The S3 path is parked in fluidnc/ with its reasons.
#
# No SD card, no SPI, no I2S. Classic ESP32 pins with a trap, all avoided:
#
#   0 2 5 12 15   strapping pins, read at reset. GPIO12 in particular sets
#                 the FLASH VOLTAGE: pulled high at boot, the chip may not
#                 start at all
#   6 to 11       wired to the flash chip inside the module
#   34 to 39      input only, cannot drive a step pin
#   1 3           UART0, which is the USB console
#
# What is left and used. On the usual devkit layouts (DOIT 30-pin and
# DevKitC 38-pin) 32, 33, 25, 26 and 27 are five adjacent pins down one
# side, with 13 a little further down the same side. Check the silkscreen
# on yours rather than trusting that.
#
#   gpio.32  x step        left cord
#   gpio.33  x dir
#   gpio.25  y step        right cord
#   gpio.26  y dir
#   gpio.27  pen servo, 50 Hz PWM
#   gpio.13  shared enable, active low, both drivers
#
# Do NOT power the drivers from the devkit's 3V3 regulator for motor
# current; give the motor rail its own supply and share only ground. The
# 3V3 pin is fine for the drivers' LOGIC supply (VDD) and MS1/MS2.
# TMC2209 logic is 3.3 V native, so nothing needs level shifting.

start:
  must_home: false

# ---------------------------------------------------------------------------
# Tuning, in the order it will actually matter.
#
# 1. acceleration_mm_per_sec2 is the pendulum knob, and it is the one real
#    problem this machine has. On cords up to 2.2 m the gondola is a 3.0
#    second pendulum with almost nothing damping it, and in the stairwell it
#    will be 6.1 seconds. Every acceleration rings it, and a heavier gondola
#    rings LONGER, because air drag barely grows with mass while the stored
#    swing energy grows in proportion. 100 is a deliberately timid starting
#    point. Raise it until the lines wobble, then halve it.
#
# 2. idle_ms is 255 (never disable) on purpose. Releasing the motors drops
#    the gondola, and since there is no homing it never finds itself again.
#
# 3. Sag is NOT corrected here and does not need to be on this rig: with an
#    800 g gondola it is under 0.04 mm anywhere on the board, and peak cord
#    tension is 8.3 N, which is 5.3 N.cm at the 20 tooth pulley: about an
#    eighth of what a NEMA 17 holds. It reaches about
#    0.9 mm at full stairwell scale with a 1.5 kg gondola, which is still
#    below the segment tolerance. polargraph.sag_error_mm() reports it.
# ---------------------------------------------------------------------------
